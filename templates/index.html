<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This meta tag is the secret to making it responsive on mobile phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Fancy Portfolio</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>

    <!-- Dropdown Navigation -->
    <nav class="navbar">
        <div class="dropdown">
            <button class="dropbtn">Menu <span class="arrow">▾</span></button>
            <div class="dropdown-content">
                <a href="#about">About Me</a>
                <a href="#projects">My Projects</a>
                <a href="#contact">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Header with Background -->
    <!-- We use inline styles here so Flask can easily find your image -->
    <header class="hero" style="background-image: url(../static/background.jpg);">
        <div class="hero-content">
            <h1>Welcome to My Portfolio</h1>
            <p>Developer & Designer</p>
        </div>
    </header>

    <!-- Page Content -->
    <main class="container">
        <section id="about" class="section">
            <h2>About Me</h2>
            <p>This is where you can write a little bit about yourself.</p>
        </section>

        <section id="projects" class="section">
            <h2>My Projects</h2>
            <div class="project-grid">
                <div class="card">Project 1</div>
                <div class="card">Project 2</div>
                <div class="card">Project 3</div>
                <div class="card">Project 4</div>
                <div class="card">Project 5</div>
                <div class="card">Project 6</div>
            </div>
        </section>

        <section id="contact" class="section">
            <h2>Contact</h2>
            <button id="helloBtn">Say Hello!</button>
        </section>
    </main>

    <!-- Footer with Background -->
    <footer class="hero" style="background-image: url(../static/background.jpg);">
        <div class="hero-content">
            <h2>Thanks for visiting!</h2>
            <p>© 2026 My Portfolio</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
